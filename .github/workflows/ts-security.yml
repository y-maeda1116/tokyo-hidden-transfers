name: TypeScript Security

# セキュリティチェック: npm audit + ESLint(security-base 設定取り込み)。
# 注: TypeScript 7 は typescript-eslint のサポート範囲外(peer typescript <6.1.0)のため、
# .ts/.tsx は ESLint の対象外（eslint.config.js の ignores で除外）。
# 型安全性は tsc、シークレット検出は secret-scan(Trivy) で代替する。
# 参考: https://github.com/y-maeda1116/security-base
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: npm audit & ESLint security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - name: ESLint security check
        run: npx eslint .

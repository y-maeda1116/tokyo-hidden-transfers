version: 2
updates:
  # GitHub Actions の定期的なバージョンアップ
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependencies
      - automated

  # npm パッケージの定期的なバージョンアップ
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependencies
      - automated
